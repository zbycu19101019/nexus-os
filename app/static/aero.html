    function apiNeedsToken(url) {
      const target = String(url || "");
      return target.startsWith("/api/") && !target.startsWith("/api/public/") && !target.startsWith("/api/auth/");
    }

    async function apiFetch(url, options = {}) {
      const token = localStorage.getItem("nexus_token") || "";
      if (!token && apiNeedsToken(url)) {
        throw new Error("Brak tokenu logowania. Otworz AERO po zalogowaniu albo przez NEXUS Capsule Manager.");
      }
      const headers = new Headers(options.headers || {});
      if (token) headers.set("X-Auth-Token", token);
      const binaryBody = typeof Blob !== "undefined" && options.body instanceof Blob;
      if (options.body && !(options.body instanceof FormData) && !binaryBody && !headers.has("Content-Type")) headers.set("Content-Type", "application/json");
      const response = await fetch(url, { ...options, headers });
      const text = await response.text();
      let data = text;
      try { data = text ? JSON.parse(text) : {}; } catch (_) {}
      if (!response.ok) {
        const detail = typeof data === "object" ? (data.detail || data.error || data) : data;
        throw new Error(typeof detail === "object" ? JSON.stringify(detail, null, 2) : (detail || `HTTP ${response.status}`));
      }
      return data;
    }

    function AeroLogin({ onLogin }) {
      const [username, setUsername] = useState(localStorage.getItem("nexus_saved_user") || localStorage.getItem("nexus_user") || "admin");
      const [password, setPassword] = useState("");
      const [remember, setRemember] = useState(!!localStorage.getItem("nexus_saved_user"));
      const [showPassword, setShowPassword] = useState(false);
      const [busy, setBusy] = useState(false);
      const [error, setError] = useState("");

      async function submitLogin(event) {
        event.preventDefault();
        setBusy(true);
        setError("");
        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: username || "admin", password })
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.detail || data.error || "Bledny login lub haslo");
          const user = data.user || { username, role: data.role, status: data.account_status || "active" };
          const status = String(data.account_status || user.status || "active").toLowerCase();
          if (status && status !== "active") throw new Error(`Konto nieaktywne: ${status}`);
          if (!data.token) throw new Error("API nie zwrocilo tokenu sesji");
          localStorage.setItem("nexus_token", data.token);
          localStorage.setItem("nexus_user", user.username || username || "admin");
          localStorage.setItem("nexus_role", user.role || "user");
          localStorage.setItem("nexus_status", status || "active");
          if (remember) localStorage.setItem("nexus_saved_user", username || "admin");
          else localStorage.removeItem("nexus_saved_user");
          if (window.NexusAeroSecurity?.requestOtp) {
            await window.NexusAeroSecurity.requestOtp({ user, username: user.username || username || "admin" });
          }
          onLogin({ token: data.token, user });
          window.NexusAeroSecurity?.updateDockVisibility?.();
        } catch (err) {
          localStorage.removeItem("nexus_token");
          setError(err.message || "Blad logowania");
        } finally {
          setBusy(false);
        }
      }

      async function registerAccount() {
        if (!username || !password) {
          setError("Wpisz uzytkownika i haslo.");
          return;
        }
        if (password.length < 8) {
          setError("Haslo musi miec minimum 8 znakow.");
          return;
        }
        setBusy(true);
        setError("");
        try {
          const response = await fetch("/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.detail || data.error || "Nie udalo sie zarejestrowac");
          setError("Wniosek utworzony. Admin musi zaakceptowac konto w ADMIN/IAM.");
        } catch (err) {
          setError(err.message || "Blad rejestracji");
        } finally {
          setBusy(false);
        }
      }

              <p className="mt-3 text-sm font-semibold leading-6 text-[#6F747B]">Logowanie zoptymalizowane pod telefon: bez autozoomu, bez autokorekty i z wygodnym polem hasla.</p>
            </div>

            <div className="grid gap-4">
              <div>
                <label className="aero-login-label" htmlFor="aero-login-user">Uzytkownik</label>
                <input
                  id="aero-login-user"
                  className="aero-login-input"
                  value={username}
                  onChange={event => setUsername(event.target.value)}
                  onFocus={mobileFieldFocus}
                  autoComplete="username"
                  autoCapitalize="none"
                  autoCorrect="off"
                  spellCheck="false"
                  enterKeyHint="next"
                  inputMode="text"
                  placeholder="admin"
                />
              </div>

              <div>
                <label className="aero-login-label" htmlFor="aero-login-password">Haslo</label>
                <div className="aero-login-pass-row">
                  <input
                    id="aero-login-password"
                    className="aero-login-input"
                    type={showPassword ? "text" : "password"}
                    value={password}
                    onChange={event => setPassword(event.target.value)}
                    onFocus={mobileFieldFocus}
                    autoComplete="current-password"
                    autoCapitalize="none"
                    autoCorrect="off"
                    spellCheck="false"
                    enterKeyHint="go"
                    placeholder="Haslo"
                  />
                  <button type="button" className="aero-login-password-toggle" onClick={() => setShowPassword(value => !value)}>
                    {showPassword ? "UKRYJ" : "POKAZ"}
                  </button>
                </div>
              </div>

              <label className="aero-login-check">
                <input type="checkbox" checked={remember} onChange={event => setRemember(event.target.checked)} />
                Zapamietaj uzytkownika na tym urzadzeniu
              </label>

              {error && <div className="aero-login-error">{error}</div>}

              <motion.button
                type="submit"

      );

    function normalizeHostStats(stats = {}) {
      const cpuCores = Number(stats.cpu_cores || server.cores || 0);
      const ramTotal = Number(stats.ram_total || server.ram || 0);
      const ramUsed = Number(stats.ram_used || 0);
      const diskPercent = Number(stats.disk_percent ?? server.storage);
      return {
        cpu: server.cpu,
        cores: cpuCores || server.cores,
        threads: Math.max(server.threads, (cpuCores || 0) * 2) || server.threads,
        ram: ramTotal || server.ram,
        cpuLoad: Number(stats.cpu ?? server.cpuLoad),
        ramLoad: Number(stats.ram_percent ?? server.ramLoad),
        storage: Number.isFinite(diskPercent) ? diskPercent : server.storage,
        uptime: stats.uptime || server.uptime,
        location: stats.os || server.location,
        ramSub: ramTotal ? `${ramUsed || "--"} / ${ramTotal} GB` : "RAM live",
        diskSub: stats.disk_free_label && stats.disk_total_label ? `${stats.disk_free_label} free / ${stats.disk_total_label}` : "libvirt images / snapshots",
        time: stats.server_time || "",
        processCount: stats.process_count ?? "--",
        sessions: stats.active_sessions ?? "--"
      };
    }

    function statusToAero(status = "") {
      const text = String(status || "").toLowerCase();
      if (text.includes("running") || text.includes("uruch")) return "online";
      if (text.includes("error") || text.includes("crash") || text.includes("panic") || text.includes("blocked")) return "error";
      return "offline";
    }

    function isVmRunningAero(vm = {}) {
      return Boolean(vm.raw?.running) || vm.status === "online" || /running|uruch/i.test(String(vm.raw?.status || ""));
    }

    function parseMemoryGb(value) {
      const raw = String(value || "").replace(",", ".");
      const number = Number((raw.match(/[\d.]+/) || ["0"])[0]);
      if (!number) return null;
      if (/gib|gb/i.test(raw)) return number;
      if (/kib|kb/i.test(raw)) return number / 1024 / 1024;
      if (/mib|mb/i.test(raw)) return number / 1024;
      return number > 1024 ? number / 1024 : number;
    }

    function thumbnailFromVm(name = "") {
      const text = String(name).toLowerCase();
      if (text.includes("ubuntu") || text.includes("debian") || text.includes("linux")) return "ubuntu";
      if (text.includes("vista")) return "vista";
      return "win7";
    }

    function normalizeVmItem(item = {}, index = 0) {
      const id = String(item.id || item.name || `vm-${index}`).trim();
      const name = String(item.name || id);
      const status = item.running ? "online" : statusToAero(item.status);
      const memGb = parseMemoryGb(item.used_mem || item.configured_mem || item.configured_mem_mb || item.memory_mb);
      const cpuValue = Number(item.cpu_percent || item.cpu || item.vcpus || 0);
      const isoList = Array.isArray(item.iso_loaded) ? item.iso_loaded.filter(Boolean) : [];
      const ipList = Array.isArray(item.ips) ? item.ips.filter(Boolean) : [];
      const vncStatus = item.vnc?.status || "unknown";
      return {
        id,
        name,
        os: `${item.type || item.backend || "libvirt"} / ${item.vcpus || item.cpu || "?"} vCPU`,
        status,
        color: status === "online" ? "#24D27E" : status === "error" ? "#FF4D63" : "#9AA7B5",
        cpu: Number.isFinite(cpuValue) ? Math.max(0, Math.min(100, Math.round(cpuValue))) : 0,
        ram: memGb ? Number(memGb.toFixed(1)) : 0,
        ramLabel: memGb ? `${memGb.toFixed(memGb >= 10 ? 0 : 1)} GB` : "--",
        disk: item.bootdisk_gb ? `${item.bootdisk_gb} GB` : (item.disk || item.disk_path || "--"),
        diskLabel: item.bootdisk_gb ? `${item.bootdisk_gb}G` : "--",
        isoLabel: isoList.length ? isoList.slice(0, 2).join(", ") : "CD-ROM --",
        ipLabel: ipList.length ? ipList.slice(0, 2).join(", ") : "IP --",
        vncLabel: vncStatus,
        thumbnail: thumbnailFromVm(name),
        message: `${item.status || "unknown"}${item.owner ? ` / ${item.owner}` : ""} / VNC ${vncStatus}`,
        raw: item
      };
    }

              animate={{ strokeDashoffset: dash }}

              transform="rotate(-90 36 36)"
            />
            <text x="36" y="36" textAnchor="middle" dominantBaseline="central" className="fill-[#1D1D1F] text-[13px] font-bold">{safeValue}%</text>

            <div className="text-sm font-semibold text-[#1D1D1F]">{sub}</div>

              <span className="h-2.5 w-2.5 rounded-full bg-[#FF6A78]" />
              <span className="h-2.5 w-2.5 rounded-full bg-[#FFD46B]" />

          >

            <div className="mt-5 flex items-center justify-between gap-3">

              <motion.button
                whileTap={{ scale: 0.97 }}
                whileHover={{ y: -1 }}

                  "rounded-full px-5 py-3 text-sm font-bold shadow-[inset_0_1px_0_rgba(255,255,255,.65)]",
                  isError ? "bg-[#FFF0F2] text-[#D91F3C]" : isOnline ? "bg-[#1D1D1F] text-white" : "bg-white/72 text-[#1D1D1F]"

    function EmptyVmInventory({ error }) {
      return (
        <div className="frost rounded-[2rem] p-6 text-sm leading-6 text-[#86868B]">
          <div className="text-xs font-extrabold uppercase tracking-[.22em] text-[#86868B]">VM Inventory</div>
          <h3 className="mt-2 text-2xl font-extrabold tracking-[-.05em] text-[#1D1D1F]">Brak realnych VM z libvirt</h3>
          <p className="mt-2">{error || "Backend nie zwrocil zadnej domeny z virsh list --all. Nie pokazuje kart demo."}</p>
        </div>
      );
    }

    function ExpandedVm({ vm, onClose, onTerminal }) {
      const consoleRef = useRef(null);
      const shellRef = useRef(null);
      const [consoleStatus, setConsoleStatus] = useState("Startuje most noVNC...");
      const [consoleTone, setConsoleTone] = useState("");
      const [clipText, setClipText] = useState(() => localStorage.getItem("nexus_shared_clipboard") || "");
      const [customWidth, setCustomWidth] = useState(() => localStorage.getItem("nexus_console_custom_w") || "1024");
      const [customHeight, setCustomHeight] = useState(() => localStorage.getItem("nexus_console_custom_h") || "768");
      const [sideOpen, setSideOpen] = useState(() => !(window.matchMedia && window.matchMedia("(max-width: 1279px), (pointer: coarse)").matches));
      const backend = vm.raw?.backend || vm.raw?.type || "auto";

      const consoleUrl = useMemo(() => {
        const params = new URLSearchParams({
          vm: vm.id,
          backend,
          token: authToken()
        });
        return `/static/manager_console.html?v=202607171020&embed=1#${params.toString()}`;
      }, [vm.id, backend]);

      function sendConsoleCommand(command, payload = {}) {
        const frame = consoleRef.current;
        if (!frame || !frame.contentWindow) {
          setConsoleStatus("Ramka konsoli nie jest jeszcze gotowa.");
          setConsoleTone("warn");
          return;
        }
        frame.contentWindow.postMessage({ source: "nexus-aero", type: "command", command, ...payload }, location.origin);
      }

      function closeVmWindow() {
        const frame = consoleRef.current;
        if (frame) {
          try {
            frame.src = "about:blank";
          } catch (_) {}
        }
        document.body.classList.remove("aero-vm-open");
        onClose();
      }

      function resetView() {
        sendConsoleCommand("resetView");
        sendConsoleCommand("center");
        setConsoleStatus("Dopasowano i wycentrowano obraz VM.");
        setConsoleTone("ok");
      }

      async function readPcClipboard() {
        if (!navigator.clipboard?.readText) {
          setConsoleStatus("Przegladarka nie pozwala odczytac schowka PC.");
          setConsoleTone("warn");
          return;
        }
        try {
          const text = await navigator.clipboard.readText();
          setClipText(text || "");
          localStorage.setItem("nexus_shared_clipboard", text || "");
          sendConsoleCommand("setClipboard", { text, source: "aero-pc" });
          setConsoleStatus(`Odczytano schowek PC (${String(text || "").length} znakow).`);
          setConsoleTone("ok");
        } catch (error) {
          setConsoleStatus(error.message || "Nie udalo sie odczytac schowka PC.");
          setConsoleTone("warn");
        }
      }

      function pasteVmClipboard() {
        localStorage.setItem("nexus_shared_clipboard", clipText || "");
        sendConsoleCommand("paste", { text: clipText || "" });
      }

      function typeVmClipboard() {
        localStorage.setItem("nexus_shared_clipboard", clipText || "");
        sendConsoleCommand("typeText", { text: clipText || "" });
      }

      function applyCustomSize() {
        localStorage.setItem("nexus_console_custom_w", String(customWidth || 1024));
        localStorage.setItem("nexus_console_custom_h", String(customHeight || 768));
        sendConsoleCommand("setCustomSize", { width: customWidth, height: customHeight });
        sendConsoleCommand("center");
        setConsoleStatus(`Ustawiono rozmiar ${customWidth}x${customHeight}.`);
        setConsoleTone("ok");
      }

      function applyPreset(width, height) {
        setCustomWidth(String(width));
        setCustomHeight(String(height));
        localStorage.setItem("nexus_console_custom_w", String(width));
        localStorage.setItem("nexus_console_custom_h", String(height));
        sendConsoleCommand("setCustomSize", { width, height });
        sendConsoleCommand("center");
        setConsoleStatus(`Preset obrazu VM: ${width}x${height}.`);
        setConsoleTone("ok");
      }

      async function toggleVmFullscreen() {
        const target = shellRef.current;
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else if (target?.requestFullscreen) await target.requestFullscreen();
          else sendConsoleCommand("fullscreen");
          setConsoleStatus(document.fullscreenElement ? "Tryb pelnego ekranu aktywny." : "Przelaczono pelny ekran.");
          setConsoleTone("ok");
          window.setTimeout(() => {
            sendConsoleCommand("resetView");
            sendConsoleCommand("center");
          }, 300);
        } catch (error) {
          sendConsoleCommand("fullscreen");
          setConsoleStatus(error.message || "Pelny ekran niedostepny w tej przegladarce.");
          setConsoleTone("warn");
        }
      }

      function ControlButton({ children, onClick, dark = false, warn = false }) {
        return (
          <button
            onClick={onClick}
            className={classNames(
              "min-h-[42px] shrink-0 touch-manipulation rounded-2xl px-4 py-3 text-xs font-extrabold shadow-[inset_0_1px_0_rgba(255,255,255,.78)]",
              dark ? "bg-[#1D1D1F] text-white" : warn ? "bg-[#FFF5E8] text-[#A15C00]" : "bg-white/70 text-[#1D1D1F]"
            )}
          >
            {children}
          </button>
        );
      }

      useEffect(() => {
        const previousBodyOverflow = document.body.style.overflow;
        const previousHtmlOverflow = document.documentElement.style.overflow;
        const previousBodyHeight = document.body.style.height;
        const previousHtmlHeight = document.documentElement.style.height;
        document.body.classList.add("aero-vm-open");
        document.body.style.overflow = "hidden";
        document.documentElement.style.overflow = "hidden";
        document.body.style.height = "100dvh";
        document.documentElement.style.height = "100dvh";
        function onConsoleMessage(event) {
          if (event.origin !== location.origin) return;
          const data = event.data || {};
          if (data.source !== "nexus-manager-console" || data.vmId !== vm.id) return;
          if (data.type === "status") {
            setConsoleStatus(data.text || "Aktualizacja konsoli");
            setConsoleTone(data.tone || "");
          }
          if (data.type === "clipboard") {
            const text = String(data.text || "");
            setClipText(text);
            localStorage.setItem("nexus_shared_clipboard", text);
          }
        }
        window.addEventListener("message", onConsoleMessage);
        function onKeyDown(event) {
          if (event.key === "Escape") closeVmWindow();
          if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "f") {
            event.preventDefault();
            toggleVmFullscreen();
          }
        }
        window.addEventListener("keydown", onKeyDown);
        window.setTimeout(() => {
          sendConsoleCommand("setScaleMode", { mode: "fit" });
          sendConsoleCommand("center");
        }, 700);
        return () => {
          document.body.classList.remove("aero-vm-open");
          document.body.style.overflow = previousBodyOverflow;
          document.documentElement.style.overflow = previousHtmlOverflow;
          document.body.style.height = previousBodyHeight;
          document.documentElement.style.height = previousHtmlHeight;
          window.removeEventListener("message", onConsoleMessage);
          window.removeEventListener("keydown", onKeyDown);
        };
      }, [vm.id]);

      return (
        <motion.div
          className="fixed inset-0 z-50 grid place-items-center overflow-hidden overscroll-contain bg-[#F5F5F7]/78 p-2 backdrop-blur-sm md:p-5"
          initial={{ opacity: 0 }}
          animate={{ opacity: 1 }}
          transition={spring}
          onPointerDown={event => {
            if (event.target === event.currentTarget) closeVmWindow();
          }}
          onMouseDown={event => {
            if (event.target === event.currentTarget) closeVmWindow();
          }}
        >
          <motion.div
            ref={shellRef}
            className="frost relative flex h-[calc(100dvh-1rem)] w-[min(1500px,98vw)] min-h-0 flex-col overflow-hidden rounded-[1.6rem] md:h-[92dvh] md:rounded-[2.25rem] xl:h-[min(920px,92dvh)]"
            initial={{ opacity: 0, scale: .98, y: 14 }}
            animate={{ opacity: 1, scale: 1, y: 0 }}
            transition={spring}
          >
            <div className="flex flex-col gap-3 border-b border-white/55 px-4 py-3 sm:flex-row sm:items-center sm:justify-between sm:px-6">
              <div className="flex items-center gap-3">
                <StatusDot status={vm.status} color={vm.color} />
                <div>
                  <motion.h2 className="text-xl font-bold tracking-[-.04em] text-[#1D1D1F] sm:text-2xl">{vm.name}</motion.h2>
                  <p className={classNames("text-sm", consoleTone === "ok" ? "text-[#168A5A]" : consoleTone === "bad" ? "text-[#D91F3C]" : consoleTone === "warn" ? "text-[#A15C00]" : "text-[#86868B]")}>{consoleStatus}</p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <motion.button whileTap={{ scale: .97 }} transition={spring} onClick={onTerminal} className="rounded-full bg-[#1D1D1F] px-4 py-3 text-sm font-bold text-cyan-100">
                  Terminal
                </motion.button>
                <motion.button whileTap={{ scale: .97 }} transition={spring} onClick={closeVmWindow} className="rounded-full bg-white/70 px-4 py-3 text-sm font-bold text-[#1D1D1F] shadow-[inset_0_1px_0_rgba(255,255,255,.9)]">
                  Zamknij
                </motion.button>
              </div>
            </div>
            <div className="sticky top-0 z-20 border-b border-white/45 bg-white/70 px-3 py-3 backdrop-blur-2xl sm:px-5">
              <div className="flex gap-2 overflow-x-auto pb-1 [-webkit-overflow-scrolling:touch]">
                <ControlButton dark onClick={() => sendConsoleCommand("reconnect")}>Polacz</ControlButton>
                <ControlButton onClick={() => sendConsoleCommand("focus")}>Focus</ControlButton>
                <ControlButton warn onClick={() => sendConsoleCommand("ctrlAltDel")}>CTRL+ALT+DEL</ControlButton>
                <ControlButton onClick={() => sendConsoleCommand("setScaleMode", { mode: "fit" })}>FIT</ControlButton>
                <ControlButton onClick={() => sendConsoleCommand("setScaleMode", { mode: "native" })}>1:1</ControlButton>
                <ControlButton onClick={() => sendConsoleCommand("center")}>Centruj</ControlButton>
                <ControlButton warn onClick={() => sendConsoleCommand("openIso")}>ISO</ControlButton>
                <ControlButton warn onClick={() => sendConsoleCommand("resetMouse")}>Reset mysz</ControlButton>
                <ControlButton onClick={() => sendConsoleCommand("toggleInput")}>Mysz/Klaw.</ControlButton>
                <ControlButton onClick={toggleVmFullscreen}>Fullscreen</ControlButton>
                <ControlButton onClick={() => setSideOpen(open => !open)}>{sideOpen ? "Panel OFF" : "Panel ON"}</ControlButton>
                <ControlButton warn onClick={() => sendConsoleCommand("disconnect")}>Rozlacz</ControlButton>
              </div>
              <div className="mt-2 grid gap-2 lg:grid-cols-[minmax(180px,1fr)_auto_auto_auto_auto_auto]">
                <input
                  value={clipText}
                  onChange={event => {
                    setClipText(event.target.value);
                    localStorage.setItem("nexus_shared_clipboard", event.target.value);
                    sendConsoleCommand("setClipboard", { text: event.target.value, source: "aero-toolbar" });
                  }}
                  placeholder="tekst do VM / schowek"
                  className="min-h-[42px] rounded-2xl border border-white/70 bg-white/70 px-3 py-3 text-sm font-bold text-[#1D1D1F] outline-none"
                />
                <ControlButton onClick={readPcClipboard}>Czytaj PC</ControlButton>
                <ControlButton onClick={pasteVmClipboard}>Wklej</ControlButton>
                <ControlButton dark onClick={typeVmClipboard}>Wpisz</ControlButton>
                <div className="grid grid-cols-2 gap-2">
                  <input value={customWidth} onChange={event => setCustomWidth(event.target.value)} inputMode="numeric" className="w-20 rounded-2xl border border-white/70 bg-white/70 px-2 py-3 text-center text-xs font-extrabold text-[#1D1D1F] outline-none" />
                  <input value={customHeight} onChange={event => setCustomHeight(event.target.value)} inputMode="numeric" className="w-20 rounded-2xl border border-white/70 bg-white/70 px-2 py-3 text-center text-xs font-extrabold text-[#1D1D1F] outline-none" />
                </div>
                <ControlButton onClick={applyCustomSize}>Rozmiar</ControlButton>
              </div>
              <div className="mt-2 flex gap-2 overflow-x-auto pb-1 [-webkit-overflow-scrolling:touch]">
                <ControlButton onClick={resetView}>Reset widoku</ControlButton>
                <ControlButton onClick={() => applyPreset(800, 600)}>800x600</ControlButton>
                <ControlButton onClick={() => applyPreset(1024, 768)}>1024x768</ControlButton>
                <ControlButton onClick={() => applyPreset(1280, 720)}>1280x720</ControlButton>
                <ControlButton onClick={() => applyPreset(1280, 1024)}>1280x1024</ControlButton>
              </div>
            </div>
            <div className="grid min-h-0 flex-1 grid-cols-1 gap-3 overflow-hidden p-3 xl:grid-cols-[minmax(0,1fr)_300px] xl:p-5">
              <motion.div className="relative min-h-[320px] overflow-hidden rounded-[1.5rem] bg-[#0A0C10] shadow-[0_24px_70px_rgba(29,29,31,.22)] md:min-h-[420px] xl:min-h-0">
                <VmConsoleFrame refObj={consoleRef} src={consoleUrl} vm={vm} onReady={() => setConsoleStatus("Ramka konsoli zaladowana. Lacze VNC...")} />
              </motion.div>
              <aside className={classNames("gap-3 sm:grid-cols-3 xl:auto-rows-min xl:grid-cols-1 xl:overflow-auto xl:pr-1", sideOpen ? "grid" : "hidden")}>
                <MetricGlass title="Guest CPU" value={`${vm.cpu}%`} tone={vm.status === "error" ? "red" : "blue"} />
                <MetricGlass title="Guest RAM" value={`${vm.ram} GB`} tone="mint" />
                <MetricGlass title="Storage" value={vm.disk} tone="blue" />
                <div className="hidden rounded-[1.35rem] border border-white/60 border-t-white/80 bg-white/48 p-3 shadow-glass backdrop-blur-2xl sm:col-span-3 xl:col-span-1 xl:block">
                  <p className="text-[10px] font-extrabold uppercase tracking-[.18em] text-[#86868B]">Schowek / wpisywanie</p>
                  <input
                    value={clipText}
                    onChange={event => {
                      setClipText(event.target.value);
                      localStorage.setItem("nexus_shared_clipboard", event.target.value);
                      sendConsoleCommand("setClipboard", { text: event.target.value, source: "aero-field" });
                    }}
                    placeholder="tekst do VM"
                    className="mt-3 w-full rounded-2xl border border-white/70 bg-white/70 px-3 py-3 text-sm font-bold text-[#1D1D1F] outline-none"
                  />
                  <div className="mt-2 grid grid-cols-3 gap-2">
                    <button onClick={readPcClipboard} className="rounded-2xl bg-white/70 px-3 py-3 text-xs font-extrabold text-[#1D1D1F]">Czytaj PC</button>
                    <button onClick={pasteVmClipboard} className="rounded-2xl bg-white/70 px-3 py-3 text-xs font-extrabold text-[#1D1D1F]">Wklej</button>
                    <button onClick={typeVmClipboard} className="rounded-2xl bg-[#1D1D1F] px-3 py-3 text-xs font-extrabold text-white">Wpisz</button>
                  </div>
                </div>
                <motion.button whileTap={{ scale: .97 }} transition={spring} onClick={() => sendConsoleCommand("reconnect")} className="rounded-[1.5rem] bg-white/64 px-5 py-4 text-sm font-bold text-[#1D1D1F] shadow-[inset_0_1px_0_rgba(255,255,255,.9)]">
                  Polacz ponownie
                </motion.button>
                <motion.button whileTap={{ scale: .97 }} transition={spring} onClick={() => sendConsoleCommand("ctrlAltDel")} className="rounded-[1.5rem] bg-[#1D1D1F] px-5 py-4 text-sm font-bold text-white shadow-[0_18px_34px_rgba(29,29,31,.16)]">
                  Wyslij CTRL+ALT+DEL
                </motion.button>
                <motion.button whileTap={{ scale: .97 }} transition={spring} onClick={() => sendConsoleCommand("toggleInput")} className="rounded-[1.5rem] bg-white/64 px-5 py-4 text-sm font-bold text-[#1D1D1F] shadow-[inset_0_1px_0_rgba(255,255,255,.9)]">
                  Input ON/OFF
                </motion.button>
                <motion.button whileTap={{ scale: .97 }} transition={spring} onClick={resetView} className="rounded-[1.5rem] bg-white/64 px-5 py-4 text-sm font-bold text-[#1D1D1F] shadow-[inset_0_1px_0_rgba(255,255,255,.9)]">
                  Dopasuj obraz
                </motion.button>
              </aside>
            </div>
          </motion.div>
        </motion.div>
      );
    }

        <div className="absolute inset-0">
          <div className="absolute inset-0 bg-[#000]" />
          <iframe
            ref={refObj}
            title={`Konsola noVNC ${vm.name}`}
            src={src}
            onLoad={onReady}
            allow="clipboard-read; clipboard-write; fullscreen"
            className="absolute inset-0 h-full w-full border-0 bg-black"
          />

            Live noVNC / {vm.id}
          </div>
        </div>

    function MetricGlass({ title, value, tone }) {

        <div className="rounded-[1.5rem] border border-white/60 border-t-white/80 bg-white/48 p-4 shadow-glass backdrop-blur-2xl">

          <LiquidFlow tone={tone} />

    function ObsidianWindow({ open, onClose }) {
      const lines = useMemo(() => [
        "nexus@epyc-core:~$ virsh list --all",
        " Id   Name                    State",
        " --   live inventory comes from /api/vms/list",
        "",
        "nexus@epyc-core:~$ journalctl -u libvirtd -n 3",
        "[OK] qemu monitor attached",
        "[WARN] websocket bridge retry scheduled",
        "[READY] awaiting operator input"
      ], []);

      return (
        <AnimatePresence>
          {open && (
            <motion.div className="fixed inset-0 z-[70] flex items-center justify-center bg-[#F5F5F7]/52 p-4 backdrop-blur-md" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}>
              <motion.section
                initial={{ y: 70, scale: .92, opacity: 0 }}
                animate={{ y: 0, scale: 1, opacity: 1 }}
                exit={{ y: 40, scale: .96, opacity: 0 }}
                transition={spring}
                className="h-[min(680px,86vh)] w-[min(980px,94vw)] overflow-hidden rounded-[2rem] bg-[#000000] shadow-[0_40px_120px_rgba(0,0,0,.46)]"
              >
                <div className="flex items-center justify-between border-b border-cyan-400/20 px-5 py-4">
                  <div className="flex items-center gap-2">
                    <span className="h-3 w-3 rounded-full bg-[#FF5F57]" />

      if (Array.isArray(payload)) return `${payload.length} rekordĂłw`;

        if (Array.isArray(payload.vms)) return `${payload.vms.length} VM`;
        if (Array.isArray(payload.processes)) return `${payload.processes.length} procesĂłw`;
        if (Array.isArray(payload.sessions)) return `${payload.sessions.length} sesji`;
        if (payload.cpu_percent !== undefined) return `CPU ${payload.cpu_percent}%`;
        if (payload.status) return String(payload.status);
        if (payload.active_count !== undefined) return `${payload.active_count} aktywnych`;
        if (payload.tools) return Object.entries(payload.tools).map(([k, v]) => `${k}:${v ? "OK" : "BRAK"}`).join(" Â· ");
        return `${Object.keys(payload).length} pĂłl`;
      }
      return label;
    }

      async function turboUploadVmMedia() {
        const files = selectedFiles();
        if (!files.length) {
          setResult({ label: "Turbo Upload VM", ok: false, text: "Wybierz ISO, opencore.qcow2 albo dysk .qcow2/.raw/.img." });
          return;
        }
        const chunkSize = Math.max(1024 * 1024, Math.min(Number(fields.chunk_mb || 5) * 1024 * 1024, 64 * 1024 * 1024));
        const concurrency = Math.max(1, Math.min(Number(fields.transfers || 6), 10));
        setBusy(true);
        const completed = [];
        try {
          for (const file of files) {
            if (!/\.(iso|qcow2|raw|img)$/i.test(file.name)) {
              throw new Error(`${file.name}: do Turbo Upload VM przyjmuje .iso, .qcow2, .raw albo .img`);
            }
            setResult({ label: "Turbo Upload VM", ok: true, text: `Inicjuje ${file.name} (${fmtBytes(file.size)})...` });
            const init = await apiFetch("/api/vms/upload/init", {
              method: "POST",
              body: JSON.stringify({
                filename: file.name,
                size: file.size,
                sha256: fields.sha256 || "",
                purpose: "iso",
                chunk_size: chunkSize,
                overwrite: Boolean(fields.overwrite_upload)
              })
            });
            update("id", init.upload_id || "");
            let nextPart = 0;
            let uploaded = 0;
            const partCount = Number(init.part_count || Math.ceil(file.size / chunkSize));
            const uploadPart = async partNumber => {
              const start = partNumber * Number(init.chunk_size || chunkSize);
              const end = Math.min(file.size, start + Number(init.chunk_size || chunkSize));
              const blob = file.slice(start, end);
              await apiFetch(`/api/vms/upload/${encodeURIComponent(init.upload_id)}/parts/${partNumber}`, {
                method: "PUT",
                headers: { "Content-Type": "application/octet-stream" },
                body: blob
              });
              uploaded += blob.size;
              const pct = file.size ? Math.round((uploaded / file.size) * 100) : 100;
              setResult({
                label: "Turbo Upload VM",
                ok: true,
                text: `${file.name}\n${fmtBytes(uploaded)} / ${fmtBytes(file.size)} (${pct}%)\nczesc ${partNumber + 1}/${partCount}\nkanaly rownolegle: ${concurrency}`
              });
            };
            const workers = Array.from({ length: Math.min(concurrency, partCount) }, async () => {
              while (nextPart < partCount) {
                const part = nextPart++;
                await uploadPart(part);
              }
            });
            await Promise.all(workers);
            setResult({ label: "Turbo Upload VM", ok: true, text: `Skladam ${file.name} po stronie serwera...` });
            const complete = await apiFetch("/api/vms/upload/complete", {
              method: "POST",
              body: JSON.stringify({ upload_id: init.upload_id, sha256: fields.sha256 || "" })
            });
            completed.push(complete);
            const path = complete.path || complete.item?.target || "";
            if (/opencore\.qcow2$/i.test(file.name) || /opencore\.qcow2$/i.test(path)) update("opencore_path", path);
            else if (/\.iso$/i.test(file.name)) update("iso_path", path);
            else update("disk_path", path);
          }
          setResult({ label: "Turbo Upload VM", ok: true, text: show({ status: "complete", uploads: completed }) });
          reloadVmVault().catch(() => {});
          refresh();
        } catch (error) {
          setResult({ label: "Turbo Upload VM", ok: false, text: error.message || "Turbo Upload nie powiodl sie" });
        } finally {
          setBusy(false);
        }
      }

    function App() {
      const [selectedVm, setSelectedVm] = useState(null);
      const [terminalOpen, setTerminalOpen] = useState(false);
      const [loading, setLoading] = useState(false);
      const [activeModule, setActiveModuleState] = useState(() => {
        const urlModule = new URLSearchParams(window.location.search).get("module");
        const hashModule = window.location.hash.replace(/^#/, "");
        const directModule = urlModule || hashModule || "dash";
        return moduleById[directModule] ? directModule : "dash";
      });
      const [live, setLive] = useState({ loading: false, rows: [] });
      const [vmInventory, setVmInventory] = useState({ loading: true, items: [], error: "" });
      const [hostStats, setHostStats] = useState(null);
      const [auth, setAuth] = useState(() => ({ token: authToken(), user: localStorage.getItem("nexus_user") || localStorage.getItem("nexus_saved_user") || "" }));

      function setActiveModule(moduleId) {
        const nextModule = moduleById[moduleId] ? moduleId : "dash";
        setActiveModuleState(nextModule);
        const url = new URL(window.location.href);
        url.searchParams.set("module", nextModule);
        window.history.replaceState(null, "", url);
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      useEffect(() => {
        function onLiquidDockSelect(event) {
          const moduleId = event.detail?.module;
          if (!moduleId) return;
          setSelectedVm(null);
          setTerminalOpen(false);
          setActiveModule(moduleId);
        }
        window.addEventListener("nexus:aero:set-module", onLiquidDockSelect);
        return () => window.removeEventListener("nexus:aero:set-module", onLiquidDockSelect);
      }, []);

      useEffect(() => {
        window.dispatchEvent(new CustomEvent("nexus:aero:module-changed", { detail: { module: activeModule } }));
      }, [activeModule]);

      async function loadVmInventory() {
        setVmInventory(prev => ({ ...prev, loading: true, error: "" }));
        try {
          const payload = await apiFetch("/api/vms/list");
          const items = (payload.items || []).map(normalizeVmItem);
          setVmInventory({ loading: false, items, error: payload.message && payload.message !== "OK" ? payload.message : "" });
        } catch (error) {
          setVmInventory({ loading: false, items: [], error: error.message || "Nie pobrano listy VM" });
        }
      }

      async function loadSystemStats() {
        if (!authToken()) return;
        try {
          const payload = await apiFetch("/api/system/stats");
          setHostStats(payload);
        } catch (_) {}
      }

      function simulateRefresh() {
        setLoading(true);
        Promise.allSettled([loadModuleData(activeModule), loadVmInventory(), loadSystemStats()]).finally(() => {
          window.setTimeout(() => setLoading(false), 350);
        });
      }

      async function loadModuleData(moduleId = activeModule) {
        const plan = apiPlan[moduleId] || [];
        if (!plan.length) {
          setLive({ loading: false, rows: [] });
          return;
        }
        setLive({ loading: true, rows: [] });
        try {
          const rows = [];
          for (const [label, url, options] of plan) {
            const payload = await apiFetch(url, options || {});
            rows.push({
              label,
              summary: summarizePayload(label, payload),
              preview: JSON.stringify(payload, null, 2).slice(0, 1400)
            });
          }
          setLive({ loading: false, rows });
        } catch (error) {
          setLive({ loading: false, rows: [], error: error.message || "Nie pobrano danych" });
        }
      }

      useEffect(() => {
        if (!auth.token) {
          setLive({ loading: false, rows: [] });
          return;
        }
        loadModuleData(activeModule);
      }, [activeModule, auth.token]);

      useEffect(() => {
        if (!auth.token) return;
        loadVmInventory();
        loadSystemStats();
        const timer = window.setInterval(() => {
          loadVmInventory();
          loadSystemStats();
        }, 15000);
        return () => window.clearInterval(timer);
      }, [auth.token]);

      const currentModule = moduleById[activeModule] || moduleById.dash;
      const liveVms = vmInventory.items.length ? vmInventory.items : vms;
      const host = normalizeHostStats(hostStats || {});

      if (!auth.token) {
        return <AeroLogin onLogin={({ token, user }) => setAuth({ token, user: user?.username || "" })} />;
      }

      return (
        <LayoutGroup>
          <div className="min-h-screen pb-10">
            <ZenithTopbar onTerminal={() => setTerminalOpen(true)} host={host} />
            <main className="mx-auto grid max-w-[1680px] gap-5 px-4 pt-5 sm:px-6 lg:grid-cols-[330px_1fr] lg:px-8">
              <AeroRail active={activeModule} onSelect={setActiveModule} />
              <div className="grid min-w-0 gap-5">
                <MobileModuleSelect active={activeModule} onSelect={setActiveModule} />
                <div className="frost flex flex-wrap items-center justify-between gap-3 rounded-[1.75rem] px-4 py-3">
                  <div className="flex items-center gap-3">
                    <KindOrb kind={currentModule.kind} />
                    <div>
                      <div className="text-[10px] font-extrabold uppercase tracking-[.22em] text-[#86868B]">Active Module</div>
                      <div className="text-lg font-extrabold tracking-[-.04em] text-[#1D1D1F]">{currentModule.label}</div>
                    </div>
                  </div>
                  <div className="flex flex-wrap gap-2">
                    <motion.button whileTap={{ scale: .97 }} whileHover={{ y: -2 }} transition={spring} onClick={() => { loadModuleData(activeModule); loadVmInventory(); loadSystemStats(); }} className="rounded-full bg-white/64 px-4 py-3 text-sm font-extrabold text-[#1D1D1F] shadow-[inset_0_1px_0_rgba(255,255,255,.8)]">
                      Live Refresh
                    </motion.button>
                    <motion.a whileTap={{ scale: .97 }} whileHover={{ y: -2 }} transition={spring} href="/static/index.html" className="rounded-full bg-[#1D1D1F] px-4 py-3 text-sm font-extrabold text-white">
                      Classic Core
                    </motion.a>
                  </div>
                </div>
                <ModuleWorkspace
                  activeModule={activeModule}
                  live={live}
                  refresh={() => loadModuleData(activeModule)}
                  setSelectedVm={setSelectedVm}
                  setTerminalOpen={setTerminalOpen}
                  loading={loading}
                  simulateRefresh={simulateRefresh}
                  vms={liveVms}
                  vmInventory={vmInventory}
                  host={host}
                />
              </div>
            </main>

            {selectedVm ? <ExpandedVm key={selectedVm.id} vm={selectedVm} onClose={() => setSelectedVm(null)} onTerminal={() => setTerminalOpen(true)} /> : null}
            <ObsidianWindow open={terminalOpen} onClose={() => setTerminalOpen(false)} />
          </div>
        </LayoutGroup>
      );
    }

    createRoot(document.getElementById("root")).render(<App />);
  </script>
  <script>
    (function() {
      function setApplianceToggleState(mode, busy) {
        const btn = document.getElementById("appliance-toggle");
        if (!btn) return;
        const normalized = String(mode || "unknown").toLowerCase();
        const nextIsDesktop = normalized === "kiosk";
        btn.dataset.mode = normalized;
        btn.classList.toggle("desktop", !nextIsDesktop);
        btn.classList.toggle("busy", !!busy);
        const modeEl = btn.querySelector(".appliance-mode");
        const subEl = btn.querySelector(".appliance-sub");
        if (modeEl) modeEl.textContent = nextIsDesktop ? "PULPIT" : "KIOSK";
        if (subEl) subEl.textContent = normalized === "kiosk" ? "KIOSK ACTIVE" : (normalized === "desktop" || normalized === "tty" ? "DESKTOP/TTY" : "TRYB ?");
      }

      async function applianceRequest(url, options = {}) {
        const headers = new Headers(options.headers || {});
        const token = localStorage.getItem("nexus_token") || "";
        if (token) headers.set("X-Auth-Token", token);
        if (options.body && !headers.has("Content-Type")) headers.set("Content-Type", "application/json");
        const response = await fetch(url, { ...options, headers });
        const text = await response.text();
        let data = text;
        try { data = text ? JSON.parse(text) : {}; } catch (_) {}
        if (!response.ok) {
          const detail = typeof data === "object" ? (data.detail || data.error || JSON.stringify(data)) : data;
          throw new Error(detail || `HTTP ${response.status}`);
        }
        return data;
      }

      async function refreshApplianceToggle() {
        try {
          const data = await applianceRequest("/api/appliance/status");
          setApplianceToggleState(data.mode || "unknown", false);
        } catch (_) {
          setApplianceToggleState("unknown", false);
        }
      }

      async function toggleApplianceMode() {
        const btn = document.getElementById("appliance-toggle");
        const current = btn?.dataset.mode || "kiosk";
        const target = current === "kiosk" ? "desktop" : "kiosk";
        const label = target === "desktop" ? "pulpitu/TTY" : "kiosku NEXUS";
        if (!window.confirm(`Przelaczyc tryb na ${label}? Aktualne okno moze zostac zamkniete przez system.`)) return;
        setApplianceToggleState(current, true);
        try {
          const data = await applianceRequest("/api/appliance/mode", { method: "POST", body: JSON.stringify({ mode: target }) });
          setApplianceToggleState(data?.state?.mode || target, false);
          console.info("NEXUS appliance switch", data);
        } catch (error) {
          setApplianceToggleState(current, false);
          window.alert(error.message || "Nie udalo sie przelaczyc trybu.");
        }
      }

      window.NexusAppliance = { refresh: refreshApplianceToggle, toggle: toggleApplianceMode };
      document.getElementById("appliance-toggle")?.addEventListener("click", toggleApplianceMode);
      window.addEventListener("DOMContentLoaded", () => {
        refreshApplianceToggle();
        window.setInterval(refreshApplianceToggle, 30000);
      });
    })();
  </script>
</body>
</html>
